site_name: Impulse Graph Engine
site_description: Embedded C-ABI Binary Snapshot Graph Engine & Register Virtual Machine
site_url: https://www.impulsegraph.org
repo_url: https://github.com/impulse-graph
repo_name: impulse-graph

theme:
  name: material
  logo: assets/logo_icon.jpg
  favicon: assets/favicon.jpg
  palette:
    - scheme: slate
      primary: black
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.smartsymbols
  - pymdownx.progressbar
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - admonition

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  design-notes/*
  ai/SKILL.md

validation:
  links:
    absolute_links: ignore

nav:
  - Home:
    - Overview: index.md
    - Benchmarks: benchmarks.md
    - Status & Roadmap: status.md
    - Release Notes: release-notes.md
    - Showcase Applications:
      - Overview: showcase/index.md
      - Authorization (ReBAC): showcase/authz.md
      - Anti-Money Laundering: showcase/aml.md
      - Power Grid Stability: showcase/powergrid.md
      - Graph Neural Networks: showcase/gnn.md

  - Start Here:
    - Choose Your Entrypoint: getting-started/index.md
    - Problem-First Guides:
      - From NetworkX, Pandas & Parquet: getting-started/from-networkx-and-parquet.md
      - Embedded Engine vs. Graph DBs: getting-started/embedded-vs-graph-db.md
      - Build Once, Mount Anywhere: getting-started/polyglot-workflow.md
    - Core Onboarding:
      - Installation: getting-started/installation.md
