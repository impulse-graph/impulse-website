    - Python & PyTorch SDK Reference: reference/python-api.md
    - C-ABI & C++20 Reference: reference/c-abi.md
    - Rust Crate Reference: reference/rust-api.md
    - Go, .NET & Node.js SDKs: reference/polyglot-sdks.md
    - CLI Reference (impulse): reference/cli.md
