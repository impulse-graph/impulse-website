site_name: Impulse Graph Engine
site_description: High-Performance C-ABI Binary Snapshot Graph Engine
site_url: https://www.impulsegraph.org
repo_url: https://github.com/impulse-graph
repo_name: impulse-graph

theme:
  name: material
  logo: assets/logo_icon.jpg
  favicon: assets/favicon.jpg
  palette:
    - scheme: slate
      primary: black
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.smartsymbols
  - pymdownx.progressbar
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - admonition

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  design-notes/bugs.md
  design-notes/cleanup-for-v0.9.0.md
  design-notes/code-protections-github-pr-todo.md
  design-notes/java-walkthru.md
  design-notes/v0.9.0-TODO.md
  design-notes/walkthru-cpp.md

validation:
  links:
    absolute_links: ignore

