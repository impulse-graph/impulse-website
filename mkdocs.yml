site_name: Impulse Graph Engine
site_description: High-Performance C-ABI Binary Snapshot Graph Engine
site_url: https://docs.impulsegraph.io

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
  - admonition

nav:
  - Home: index.md
  - Benchmarks & Performance:
    - Overview: benchmarks.md
    - Java HotSpot vs. GraalVM: benchmarks/java-hotspot-vs-graal.md
    - Multi-JVM Ecosystem: benchmarks/jvm-ecosystem-comparison.md

  - Getting Started:
    - Overview: getting-started/index.md
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Core Concepts: getting-started/core-concepts.md

  - Concepts:
    - Snapshots: concepts/snapshots.md
    - Graph Model: concepts/graph-model.md
    - Delta Overlay: concepts/delta-overlay.md
    - GraphView: concepts/graph-view.md
    - Schema: concepts/schema.md

  - Query API:
    - Overview: query-api/index.md
    - Building Queries: query-api/building-queries.md
    - Bytecode Virtual Machine (ImpOps): query-api/bytecode-vm.md
    - Operations:
      - Walk Edge: query-api/operations/walk-edge.md
      - Set Algebra: query-api/operations/set-algebra.md
      - Iteration: query-api/operations/iteration.md
      - Terminals: query-api/operations/terminals.md
    - Schema Binding: query-api/schema-binding.md
    - Execution Context: query-api/execution-context.md
    - Memory Layout: query-api/memory-layout.md
    - GraphView & Execution: query-api/graph-view-execution.md

  - Deployment:
    - Dynamic Service: deployment/dynamic-service.md
    - Fixed Snapshot: deployment/fixed-snapshot.md
    - Capacity & Growth: deployment/capacity-growth.md
    - Concurrency Model: deployment/concurrency.md

  - Showcase:
    - Authorization (ReBAC): showcase/authz.md
    - Anti-Money Laundering: showcase/aml.md
    - Power Grid Stability: showcase/powergrid.md
    - Graph Neural Networks: showcase/gnn.md

  - Reference:
    - C++ API Reference: reference/cpp-api.md
    - Java API Reference: reference/java-api.md
    - Python API Reference: reference/python-api.md
    - CLI Reference: reference/cli.md

    - Operations Cheatsheet: reference/operations-cheatsheet.md
    - Binary Snapshot Spec:
      - Version Selector Hub: reference/spec/index.md
      - Specification v0.9.0 (Current): reference/spec/v0.9.0.md
    - Schema Evolution: reference/schema-evolution.md
    - Package Registry: reference/packages.md

  - Contributing: contributing/index.md
