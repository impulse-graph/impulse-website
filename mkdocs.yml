site_name: Impulse Graph Engine
site_description: High-Performance C-ABI Binary Snapshot Graph Engine
site_url: https://www.impulsegraph.org
repo_url: https://github.com/impulse-graph
repo_name: impulse-graph

theme:
  name: material
  logo: assets/logo_icon.jpg
  favicon: assets/favicon.jpg
  palette:
    - scheme: slate
      primary: black
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.smartsymbols
  - pymdownx.progressbar
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - admonition

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  design-notes/*

validation:
  links:
    absolute_links: ignore

nav:
  - Home:
    - Overview: index.md
    - Status & Roadmap: status.md
    - Software Modules: software-modules.md
    - Contributing:
      - Contributing Guide: contributing/index.md
      - Polyglot Validation & Test Process: contributing/polyglot-validation.md

  - Getting Started:
    - Overview: getting-started/index.md
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Core Concepts & Glossary: getting-started/core-concepts.md
    - Building Snapshots (Java): getting-started/building-snapshots.md
    - Building Snapshots (CLI & Python): getting-started/snapshot-builder-reference.md
    - Changing Data & Live Updates: getting-started/handling-mutations.md
    - Showcase Applications:
      - Overview: showcase/index.md
      - Authorization (ReBAC): showcase/authz.md
      - Anti-Money Laundering: showcase/aml.md
      - Power Grid Stability: showcase/powergrid.md
      - Graph Neural Networks: showcase/gnn.md

  - Concepts & Architecture:
    - Why Impulse Graph?: concepts/why-impulse.md
    - Data-Oriented Design: concepts/data-oriented-design.md
    - Snapshots, Domains & Schema (.imps): concepts/snapshots.md
    - Zero-Allocation Execution & Buffers: concepts/key-mapping-and-projections.md
    - Compiler Pipeline & ImpulseVM: concepts/compiler-architecture.md
    - Mathematical & GraphBLAS Foundations: academic.md

  - Querying & DSLs:
    - Overview & Query Modes: query-api/index.md
    - Fluent Traversal API: query-api/fluent-api.md
    - State Projections, Reducers & Loops: query-api/advanced-querying.md
    - openCypher Guide: dsl/opencypher.md
    - Google CEL (Filters & Math): dsl/cel.md
    - ImpLog (Datalog & ReBAC): dsl/implog.md
    - ImpK (GraphBLAS & Vectors): dsl/impk.md
